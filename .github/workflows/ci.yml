name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    repository-hygiene:
        name: Repository hygiene
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - run: |
                  # .npmrc is deliberately not in this list: the repo commits one with
                  # engine-strict=true (see CLAUDE.md's Node 26 bullet) to enforce the
                  # `engines` field, rather than leaving it advisory-only. Everything
                  # else here stays forbidden as local/generated config that shouldn't
                  # be tracked.
                  forbidden=$(git ls-files | grep -E '^(node_modules|\.astro|dist|playwright-report|test-results|contrast-results|\.vscode|\.idea|\.env$|\.env\.|\.yarnrc)' || true)
                  if [ -n "$forbidden" ]; then
                    echo "Forbidden tracked files found:"
                    echo "$forbidden"
                    exit 1
                  fi

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint

    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run typecheck

    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            # --omit=dev: only vulnerabilities in packages actually shipped
            # in the production build/runtime block CI. netlify-cli bundles
            # its own dev-only tooling (a local functions bundler, image
            # proxy) with a handful of high-severity advisories that only
            # have a fix via a major-version downgrade of netlify-cli
            # itself — not a reasonable tradeoff for tooling that never
            # ships. See CLAUDE.md.
            - run: npm run check:audit

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run check:trailing-slashes
            # astro build only, not `npm run build` — the astro check prefix
            # is skipped here since the typecheck job already runs it on the
            # same commit; see issue #126.
            - run: npm run build:app

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run check:trailing-slashes
            - run: npx playwright install chromium
            - run: npm test
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

    contrast:
        name: Color Contrast (report only)
        runs-on: ubuntu-latest
        # PR-only: the result is posted as a PR comment, which has nothing
        # to attach to on a push-to-main run.
        if: github.event_name == 'pull_request'
        permissions:
            pull-requests: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npx playwright install chromium
            # This check is intentionally report-only (see CLAUDE.md /
            # issue #149) — never let an infra hiccup here fail the build.
            - run: npm run test:contrast
              continue-on-error: true
            # Deliberately NOT continue-on-error: a missing result set means
            # the scan above never produced output at all (broken pipeline),
            # which check-contrast.mjs treats as a hard failure distinct
            # from "the site is clean" — see its own comment for why.
            - run: npm run check:contrast
            - name: Comment on PR
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
              with:
                  script: |
                      const fs = require('fs')
                      const status = JSON.parse(fs.readFileSync('contrast-results/status.json', 'utf8'))
                      const marker = '<!-- contrast-report -->'

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      })
                      const existing = comments.find((c) => c.body?.includes(marker))

                      // Stay silent on a clean run unless there's a prior
                      // report to correct — don't comment just to say
                      // "still clean" on every push.
                      if (!status.hasNew && !existing) return

                      const body = fs.readFileSync('contrast-results/summary.md', 'utf8')

                      try {
                        if (existing) {
                          await github.rest.issues.updateComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            comment_id: existing.id,
                            body,
                          })
                        } else {
                          await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            body,
                          })
                        }
                      } catch (error) {
                        // GitHub forces GITHUB_TOKEN to read-only for
                        // pull_request runs from forks, regardless of this
                        // job's declared permissions — don't let that 403
                        // fail the job, but don't swallow it silently
                        // either.
                        core.warning(`Could not post/update the contrast report comment (likely a fork PR with a read-only token): ${error.message}`)
                      }
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always()
              with:
                  name: contrast-results
                  path: contrast-results/
                  retention-days: 30
