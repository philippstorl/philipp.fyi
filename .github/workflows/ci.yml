name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    repository-hygiene:
        name: Repository hygiene
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                  forbidden=$(git ls-files | grep -E '^(node_modules|\.astro|dist|playwright-report|test-results|\.vscode|\.idea|\.env$|\.env\.|\.npmrc|\.yarnrc)' || true)
                  if [ -n "$forbidden" ]; then
                    echo "Forbidden tracked files found:"
                    echo "$forbidden"
                    exit 1
                  fi

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint

    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            - run: npm run format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            - run: npm run typecheck

    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            # --omit=dev: only vulnerabilities in packages actually shipped
            # in the production build/runtime block CI. netlify-cli bundles
            # its own dev-only tooling (a local functions bundler, image
            # proxy) with a handful of high-severity advisories that only
            # have a fix via a major-version downgrade of netlify-cli
            # itself — not a reasonable tradeoff for tooling that never
            # ships. See CLAUDE.md.
            - run: npm run check:audit

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            - run: npm run check:trailing-slashes
            - run: npm run build

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: "npm"
            - run: npm ci
            - run: npm run check:trailing-slashes
            - run: npx playwright install chromium
            - run: npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
