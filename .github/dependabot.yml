version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore"
          prefix-development: "chore"
          include: "scope"
      cooldown:
          default-days: 3
          semver-major-days: 7
      groups:
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore"
          include: "scope"
      cooldown:
          default-days: 3
      groups:
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
