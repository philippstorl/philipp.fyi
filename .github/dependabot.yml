version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      # Pinned so Dependabot stops inferring the prefix from recent history (issue #419).
      commit-message:
          prefix: "chore"
          prefix-development: "chore"
          include: "scope"
      groups:
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      # Same pin as npm above.
      commit-message:
          prefix: "chore"
          include: "scope"
      groups:
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
