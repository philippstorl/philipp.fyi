version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      groups:
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
