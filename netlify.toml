[build]
    command = "npm run build"
    publish = "dist"

    [build.environment]
        NODE_VERSION = "26"

# Runs Lighthouse automatically after every deploy and reports
# scores in the Netlify UI. No further configuration needed.
[[plugins]]
    package = "@netlify/plugin-lighthouse"

# `netlify dev` starts Astro via the command below and proxies
# it through Netlify's runtime (forms, redirects, headers, etc.)
[dev]
    command    = "astro dev"
    targetPort = 4321
    port       = 8888
    autoLaunch = false

# Target is "/404", not "/404/", even though trailingSlash: 'always'
# governs every other route. Astro special-cases 404/500 pages to always
# emit a flat dist/404.html instead of dist/404/index.html, regardless of
# the trailingSlash setting (node_modules/astro/dist/core/output-filename.js,
# STATUS_CODE_PAGES). This is undocumented, version-specific Astro behavior,
# not a guaranteed contract — re-verify dist/404.html still exists at the
# build root after any Astro major-version bump.
[[redirects]]
    from   = "/*"
    to     = "/404"
    status = 404

[[headers]]
    for = "/*"

    [headers.values]
        # Enforce HTTPS for 1 year; instructs the browser to refuse
        # plain HTTP before it even hits the server.
        Strict-Transport-Security = "max-age=31536000; includeSubDomains"

        # Prevent clickjacking — this site should never be framed.
        X-Frame-Options = "DENY"

        # Prevent MIME type sniffing.
        X-Content-Type-Options = "nosniff"

        # Send only the origin (not the full URL path) to cross-origin
        # destinations; send nothing on HTTP downgrade.
        Referrer-Policy = "strict-origin-when-cross-origin"

        # Disable browser features this site doesn't use.
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

        # Prevent cross-origin window references (Spectre / tab-nabbing).
        Cross-Origin-Opener-Policy = "same-origin"

        # Explicitly disable the deprecated XSS auditor. Modern browsers
        # have removed it entirely; setting 0 disables it in legacy browsers
        # that still respond to it. CSP (below) is the modern replacement.
        X-XSS-Protection = "0"

        # Content Security Policy. This header is deliberately permissive on
        # script-src/style-src ('unsafe-inline' on both) — astro.config.mjs's
        # security.csp (an auto-generated, hash-only meta CSP) hardens most
        # of what actually matters, but NOT everything: it can't cover
        # BaseLayout.astro's own <head> content (the dark-mode script), only
        # what Astro places in <body>. See CLAUDE.md's security.csp bullet
        # for the full mechanism, why 'unsafe-inline' must stay here
        # regardless, and the ClientRouter compatibility caveat.
        # — img-src scoped to 'self' data: only (https: dropped) — no
        #   content currently loads an external image; see CLAUDE.md's
        #   img-src bullet for what this doesn't cover. Widen back to
        #   include https: if a case study ever needs a real external image.
        # — TODO: when Plausible analytics is added, append
        #         "https://plausible.io" to BOTH script-src and connect-src
        #         here (an external script source needs script-src's own
        #         allowlist — 'unsafe-inline' only covers inline content, not
        #         external URLs) AND to astro.config.mjs's
        #         security.csp.scriptDirective.resources (a browser enforces
        #         the intersection of the header and the meta CSP, so
        #         missing either one blocks the script).
        # — report-to/report-uri send violation reports to
        #   netlify/functions/csp-report.ts (issue #146). Both directives
        #   point at the same endpoint for broader browser support. Only
        #   this header-delivered CSP can carry them — the spec excludes
        #   both from <meta>-delivered policies.
        # — connect-src allows https://ingesteer.services-prod.nsvcs.net
        #   (issue #160): Netlify's own built-in RUM beacon, served
        #   same-origin from /.netlify/scripts/rum (so script-src needs no
        #   change), reports performance data to this third-party endpoint.
        #   Without it the browser blocks the beacon's connect-src request
        #   and it gets reported back through our own csp-report.ts as a
        #   violation, even though it's Netlify's own platform feature, not
        #   anything added in this repo.
        # — script-src allows data: (a URL scheme, not 'unsafe-inline'
        #   coverage) for View Transitions' own internal runScripts()
        #   barrier: on a client-side navigation, Astro injects
        #   <script type="module" src="data:application/javascript,"/> to
        #   wait for an inline module script to finish. That's matched by
        #   URL, not by hash, so astro.config.mjs's
        #   security.csp.scriptDirective.resources needs the same data:
        #   entry — a browser enforces the intersection of this header and
        #   the meta CSP, so missing either one blocks the script.
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-to csp-endpoint; report-uri /.netlify/functions/csp-report"

        # Defines the "csp-endpoint" group the CSP header's report-to
        # directive references, per the Reporting API spec.
        Reporting-Endpoints = "csp-endpoint=\"/.netlify/functions/csp-report\""

# Astro outputs content-hashed filenames to /_astro/. These are
# safe to cache for a year — any change produces a new hash.
[[headers]]
    for = "/_astro/*"

    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

# Keeps search results on the authored pages, not raw files.
# Visitors should land on /work/storyblok-migration, not screenshot.png.
[[headers]]
    for = "*.pdf"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.jpg"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.jpeg"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.png"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.webp"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.avif"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

[[headers]]
    for = "*.svg"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"
